<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crisper AI — Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #131313; color: #e5e2e1; min-height: 100vh; padding: 48px 24px; }
    .container { max-width: 560px; margin: 0 auto; }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, #4edea3, #6ffbbe); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    h1 { font-size: 26px; font-weight: 700; }
    .tagline { color: #bbcabf; font-size: 14px; margin-bottom: 40px; margin-top: 4px; }
    .card { display: block; background: #1c1b1b; border: 1px solid #3c4a42; border-radius: 16px; padding: 20px 22px; margin-bottom: 12px; text-decoration: none; color: #e5e2e1; transition: background 0.15s; }
    .card:hover { background: #201f1f; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: #bbcabf; }
    .dot { display: inline-block; width: 8px; height: 8px; background: #4edea3; border-radius: 50%; margin-right: 8px; }
    footer { margin-top: 48px; font-size: 12px; color: #bbcabf; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">🥦</div>
      <div>
        <h1>Crisper AI</h1>
        <p class="tagline">Legal Documents</p>
      </div>
    </div>
    <a class="card" href="privacy.html">
      <div class="card-title"><span class="dot"></span>Privacy Policy</div>
      <div class="card-sub">How we collect, use and protect your data</div>
    </a>
    <a class="card" href="terms.html">
      <div class="card-title"><span class="dot"></span>Terms of Service</div>
      <div class="card-sub">Terms and conditions for using Crisper AI</div>
    </a>
    <footer>© 2025 Ashton Ryan & Zavier Darcy · crisperaiapp@gmail.com</footer>
  </div>
</body>
</html>
